# Render free web service sleeps after ~15 min idle — closed WebSockets and paused sweep.
# This workflow pings GET /health every 5 minutes. Supabase keepalive lives in
# supabase-keepalive.yml (daily) so the two cadences no longer share one schedule
# block — GitHub would otherwise coalesce them and the 5-min job would also run
# the DB ping 288 times a day.
#
# Known caveat: GitHub drops 5-min ticks on free repos (~1 in 80 observed). Keep
# this as redundancy and put a real 5-min uptime monitor (UptimeRobot) on /health.
# Variable RENDER_HEALTH_URL overrides the default blueprint URL.

name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive-render
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping Render /health
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          url="${RENDER_HEALTH_URL:-https://atsumaru-6i3n.onrender.com/health}"
          echo "Pinging ${url}"
          for attempt in 1 2 3; do
            code=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Render awake: $(cat response.json)"
              exit 0
            fi
            echo "Attempt ${attempt} HTTP ${code}: $(cat response.json 2>/dev/null || echo no body)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::Render did not respond after 3 attempts"
          exit 1
