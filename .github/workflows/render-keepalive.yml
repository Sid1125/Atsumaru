# Render free web services sleep after ~15 minutes of inactivity, and a sleeping
# instance closes every open Socket.io connection and pauses the 5-minute
# post-meetup sweep until the next request wakes it. One request every 5 minutes
# keeps it awake — GitHub Actions' finest cron granularity, with enough margin
# that a delayed or dropped run (scheduled jobs do get delayed on busy minutes)
# still lands inside the 15-minute window.
#
# The endpoint is the public /health check — no auth, no secrets. The service URL
# is read from the repository *variable* RENDER_HEALTH_URL (Settings -> Secrets
# and variables -> Actions -> Variables) and falls back to the name the
# render.yaml blueprint provisions. If the service is ever on the paid Starter
# plan it never sleeps, and this job simply becomes harmless insurance.

name: Keep Render service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Ping the health endpoint
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail

          # Default matches the render.yaml blueprint; set the repository variable
          # RENDER_HEALTH_URL if Render assigned a suffixed URL instead.
          url="${RENDER_HEALTH_URL:-https://atsumaru-6i3n.onrender.com/health}"
          echo "Pinging ${url}"

          # A cold free-tier boot can take 30-60s+, so the first attempt can time
          # out even though the service is fine — retry before declaring it dead.
          for attempt in 1 2 3; do
            code=$(curl -sS -o response.json -w "%{http_code}" \
              --max-time 90 "$url" || echo "000")

            if [ "$code" = "200" ]; then
              echo "Render service is awake: $(cat response.json)"
              exit 0
            fi

            echo "Attempt ${attempt} returned HTTP ${code}: $(cat response.json 2>/dev/null || echo no body)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done

          echo "::error::Render service did not respond after 3 attempts — it may be paused or the URL is wrong."
          exit 1
