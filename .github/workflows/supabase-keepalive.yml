# Supabase free projects pause after 7 days idle; one RPC a day keeps it alive.
# Split from keepalive.yml so the 5-min Render cadence isn't coalesced with this.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive-supabase
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY must be set"
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o response.json -w "%{http_code}" --max-time 30 \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/ping_keepalive" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" -d '{}' || echo "000")
            if [ "$code" = "200" ]; then
              echo "DB awake: $(cat response.json)"
              exit 0
            fi
            echo "Attempt ${attempt} HTTP ${code}: $(cat response.json 2>/dev/null || echo no body)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::DB did not respond"
          exit 1
